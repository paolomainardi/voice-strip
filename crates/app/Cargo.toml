[package]
name = "app"
version = "0.6.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "voice-strip"
path = "src/main.rs"

[dependencies]
app-core.workspace = true
dsp.workspace = true
engine.workspace = true
ui-kit.workspace = true
# eframe's defaults without egui-wgpu's macOS live-resize fix: it presents
# frames only with Core Animation transactions until the next window event,
# which leaves a stretched old frame after the app resizes its own window.
# The window is not resizable by hand, so the fix is not needed.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "x11", "wgpu_no_default_features"] }
egui-wgpu = { version = "0.36.2", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
wgpu = "30.0.1"
winit = "0.30.13"
png = "0.18.1"

[target.'cfg(target_os = "linux")'.dependencies]
vdev-linux.workspace = true
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
vdev-macos.workspace = true
vdev-macos-driver.workspace = true
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSScreen"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString"] }
tray-icon = { version = "0.26.1", default-features = false }

[lints]
workspace = true
