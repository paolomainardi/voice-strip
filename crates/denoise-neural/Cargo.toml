[package]
name = "denoise-neural"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dsp.workspace = true
rtrb.workspace = true
# DeepFilterNet at tag v0.5.6. The model is not embedded: see `model.rs`.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = ["tract"] }
ndarray = "0.15"
sha2 = "0.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.190"
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
assert_no_alloc = "1"
hound = "3"

[lints]
workspace = true
