<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Vista standard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Oswald:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B2620}a:hover{color:#8A3A22}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 420px; height: 648px; box-sizing: border-box; padding: 10px; background: #2A1F17; border-radius: 16px; font-family: 'Oswald', 'Arial Narrow', sans-serif; color: #2B2620">
<div style="position: relative; height: 100%; box-sizing: border-box; padding: 18px 20px; background: #EAE2CE; border-radius: 10px; display: flex; flex-direction: column; gap: 14px">
<span style="position: absolute; top: 7px; left: 7px; width: 6px; height: 6px; border-radius: 3px; background: #B7AC93"></span>
<span style="position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 3px; background: #B7AC93"></span>
<span style="position: absolute; bottom: 7px; left: 7px; width: 6px; height: 6px; border-radius: 3px; background: #B7AC93"></span>
<span style="position: absolute; bottom: 7px; right: 7px; width: 6px; height: 6px; border-radius: 3px; background: #B7AC93"></span>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column">
<span style="font-size: 20px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase">[Nome app]</span>
<span style="font-size: 11px; letter-spacing: 2px; color: #5E5548; text-transform: uppercase">Voice processor</span>
</div>
<button onClick="{{toggleOn}}" aria-pressed="{{onPressed}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; background: #2B2620; color: #EAE2CE; border: 0; border-radius: 6px; font-size: 13px; letter-spacing: 2px; cursor: pointer">
<span style="{{onLamp}}"></span>{{onLabel}}</button>
</div>

<div style="display: flex; gap: 12px">
<div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 4px">
<svg viewBox="0 0 200 130" width="100%" role="img" aria-label="VU meter ingresso">
<rect x="1" y="1" width="198" height="128" rx="8" fill="#F3E7C4" stroke="#2B2620" stroke-width="2"></rect>
<path d="M37.2,57.3 A82,82 0 0 1 121.2,30.8" fill="none" stroke="#2B2620" stroke-width="1.5"></path>
<path d="M121.2,30.8 A82,82 0 0 1 162.8,57.3" fill="none" stroke="#B4372A" stroke-width="4"></path>
<g stroke="#2B2620" stroke-width="1.5">
<line x1="37.2" y1="57.3" x2="44.8" y2="63.7"></line><line x1="59" y1="39" x2="64" y2="47.6"></line><line x1="72" y1="32.9" x2="75.4" y2="42.3"></line><line x1="82.9" y1="29.8" x2="85" y2="39.6"></line><line x1="95.7" y1="28.1" x2="96.3" y2="38.1"></line><line x1="111.4" y1="28.8" x2="110" y2="38.7"></line>
</g>
<g stroke="#B4372A" stroke-width="1.5">
<line x1="121.2" y1="30.8" x2="118.6" y2="40.4"></line><line x1="133.4" y1="35.1" x2="129.3" y2="44.2"></line><line x1="147.1" y1="42.8" x2="141.3" y2="51"></line><line x1="162.8" y1="57.3" x2="155.2" y2="63.7"></line>
</g>
<g font-family="Oswald, sans-serif" font-size="10" text-anchor="middle" fill="#2B2620">
<text x="28" y="50">-20</text><text x="53" y="29">-10</text><text x="80" y="18">-5</text><text x="95" y="16">-3</text><text x="124" y="19" fill="#B4372A">0</text><text x="172" y="50" fill="#B4372A">+3</text>
<text x="100" y="92" font-size="16" letter-spacing="2">VU</text>
</g>
<line x1="100" y1="112" x2="100" y2="34" stroke="#1E1A16" stroke-width="1.6" transform="rotate({{inAngle}} 100 112)"></line>
<path d="M78,129 A22,22 0 0 1 122,129 Z" fill="#2B2620"></path>
</svg>
<div style="display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 2px">
<span>INGRESSO</span>
<span style="{{peakLamp}}" aria-label="Indicatore di picco"></span>
</div>
</div>
<div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 4px">
<svg viewBox="0 0 200 130" width="100%" role="img" aria-label="VU meter uscita">
<rect x="1" y="1" width="198" height="128" rx="8" fill="#F3E7C4" stroke="#2B2620" stroke-width="2"></rect>
<path d="M37.2,57.3 A82,82 0 0 1 121.2,30.8" fill="none" stroke="#2B2620" stroke-width="1.5"></path>
<path d="M121.2,30.8 A82,82 0 0 1 162.8,57.3" fill="none" stroke="#B4372A" stroke-width="4"></path>
<g stroke="#2B2620" stroke-width="1.5">
<line x1="37.2" y1="57.3" x2="44.8" y2="63.7"></line><line x1="59" y1="39" x2="64" y2="47.6"></line><line x1="72" y1="32.9" x2="75.4" y2="42.3"></line><line x1="82.9" y1="29.8" x2="85" y2="39.6"></line><line x1="95.7" y1="28.1" x2="96.3" y2="38.1"></line><line x1="111.4" y1="28.8" x2="110" y2="38.7"></line>
</g>
<g stroke="#B4372A" stroke-width="1.5">
<line x1="121.2" y1="30.8" x2="118.6" y2="40.4"></line><line x1="133.4" y1="35.1" x2="129.3" y2="44.2"></line><line x1="147.1" y1="42.8" x2="141.3" y2="51"></line><line x1="162.8" y1="57.3" x2="155.2" y2="63.7"></line>
</g>
<g font-family="Oswald, sans-serif" font-size="10" text-anchor="middle" fill="#2B2620">
<text x="28" y="50">-20</text><text x="53" y="29">-10</text><text x="80" y="18">-5</text><text x="95" y="16">-3</text><text x="124" y="19" fill="#B4372A">0</text><text x="172" y="50" fill="#B4372A">+3</text>
<text x="100" y="92" font-size="16" letter-spacing="2">VU</text>
</g>
<line x1="100" y1="112" x2="100" y2="34" stroke="#1E1A16" stroke-width="1.6" transform="rotate({{outAngle}} 100 112)"></line>
<path d="M78,129 A22,22 0 0 1 122,129 Z" fill="#2B2620"></path>
</svg>
<div style="display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 2px">
<span>USCITA</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0; color: #5E5548">{{lufs}} LUFS</span>
</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 12px; letter-spacing: 2px; width: 30px">GR</span>
<div style="flex: 1 1 auto; display: flex; gap: 4px; padding: 5px; background: #2B2620; border-radius: 4px" aria-label="Riduzione di guadagno">
<sc-for list="{{grLeds}}" as="led" hint-placeholder-count="12">
<span style="{{led.style}}"></span>
</sc-for>
</div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; width: 52px; text-align: right">{{grText}}</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div role="group" aria-label="Preset" style="display: flex; gap: 6px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="5">
<button onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 52px; padding: 6px 2px; background: #D9CFB6; color: #2B2620; border: 1px solid #A89C80; border-radius: 6px; cursor: pointer; font-size: 11px; letter-spacing: 1px; text-transform: uppercase">
<span style="{{p.lamp}}"></span>{{p.label}}</button>
</sc-for>
</div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5E5548; text-align: center">{{presetDesc}}</span>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 12px; letter-spacing: 2px; width: 64px; line-height: 1.1">RUMORE</span>
<div role="group" aria-label="Riduzione rumore neurale" style="flex: 1 1 auto; display: flex; gap: 6px">
<sc-for list="{{dnLevels}}" as="d" hint-placeholder-count="4">
<button onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 4px; background: #D9CFB6; color: #2B2620; border: 1px solid #A89C80; border-radius: 6px; cursor: pointer; font-size: 11px; letter-spacing: 1px; text-transform: uppercase">
<span style="{{d.lamp}}"></span>{{d.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: 1 1 auto">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 84px">
<button onClick="{{toggleMon}}" aria-pressed="{{monPressed}}" aria-label="Ritorno in cuffia" style="position: relative; width: 44px; height: 56px; background: #C9BEA3; border: 1px solid #A89C80; border-radius: 6px; cursor: pointer; padding: 0">
<span style="position: absolute; left: 15px; top: 21px; width: 12px; height: 12px; border-radius: 6px; background: #8C8270"></span>
<span style="{{monLever}}"></span>
</button>
<span style="font-size: 11px; letter-spacing: 2px">CUFFIA</span>
<span style="{{monLamp}}"></span>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="position: relative; width: 120px; height: 120px">
<svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
<g stroke="#2B2620" stroke-width="1.5" stroke-linecap="round">
<line x1="18.2" y1="101.8" x2="23.9" y2="96.1"></line><line x1="6" y1="60" x2="14" y2="60"></line><line x1="18.2" y1="18.2" x2="23.9" y2="23.9"></line><line x1="60" y1="6" x2="60" y2="14"></line><line x1="101.8" y1="18.2" x2="96.1" y2="23.9"></line><line x1="114" y1="60" x2="106" y2="60"></line><line x1="101.8" y1="101.8" x2="96.1" y2="96.1"></line>
</g>
<circle cx="60" cy="60" r="40" fill="#2B2620"></circle>
<circle cx="60" cy="60" r="34" fill="#3A332B" stroke="#4A4238" stroke-width="2"></circle>
<g transform="rotate({{knobAngle}} 60 60)">
<line x1="60" y1="30" x2="60" y2="44" stroke="#F0A23B" stroke-width="3" stroke-linecap="round"></line>
</g>
</svg>
<input type="range" min="0" max="100" value="{{intensity}}" onChange="{{setIntensity}}" aria-label="Intensità" style="position: absolute; inset: 0; width: 120px; height: 120px; opacity: 0; cursor: ew-resize; margin: 0">
</div>
<span style="font-size: 12px; letter-spacing: 2px">INTENSITÀ <span style="font-family: 'IBM Plex Mono', monospace; letter-spacing: 0">{{intensity}}</span></span>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 84px">
<button onClick="{{toggleAB}}" aria-label="Confronto A/B" style="width: 56px; height: 56px; border-radius: 28px; background: #D9CFB6; border: 2px solid #2B2620; color: #2B2620; font-size: 15px; font-weight: 600; letter-spacing: 1px; cursor: pointer">{{abLabel}}</button>
<span style="font-size: 11px; letter-spacing: 2px">A / B</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #5E5548">{{abHint}}</span>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid #C9BEA3; font-size: 12px">
<span style="font-family: 'IBM Plex Mono', monospace; color: #5E5548">{{latency}}</span>
<a href="Main.dc.html" style="display: flex; align-items: center; min-height: 32px; padding: 0 4px; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; font-weight: 500">Avanzate</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":648}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.inDb = -12;
    this.target = -8;
    this.timer = setInterval(() => {
      if (Math.random() < 0.12) this.target = Math.random() < 0.2 ? -22 : -14 + Math.random() * 14;
      this.inDb += (this.target - this.inDb) * 0.35 + (Math.random() - 0.5) * 2.5;
      this.setState({ tick: Date.now(), inDb: this.inDb });
    }, 90);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  angleFor(db) {
    const t = [[-20, -50], [-10, -30], [-7, -20], [-5, -12], [-3, -3], [-1, 8], [0, 15], [1, 24], [2, 35], [3, 50]];
    if (db <= t[0][0]) return -52;
    if (db >= 3) return 50;
    for (let i = 0; i < t.length - 1; i++) {
      if (db >= t[i][0] && db <= t[i + 1][0]) {
        const k = (db - t[i][0]) / (t[i + 1][0] - t[i][0]);
        return t[i][1] + k * (t[i + 1][1] - t[i][1]);
      }
    }
    return 0;
  }
  renderVals() {
    const s = this.state || {};
    const on = s.on !== false;
    const preset = s.preset ?? 'broadcast';
    const mon = !!s.mon;
    const ab = s.ab ?? 'A';
    const intensity = Number(s.intensity ?? 60);
    const inDb = s.inDb ?? -12;
    const active = on && ab === 'A';
    const k = intensity / 100;
    const outDb = active ? Math.max(-22, Math.min(1, -3 + (inDb + 8) * (1 - 0.7 * k))) : inDb;
    const gr = active ? Math.max(0, Math.min(12, (inDb + 10) * 0.55 * (0.4 + k))) : 0;
    const lit = Math.round(gr);

    const defs = [
      { id: 'broadcast', label: 'Broadcast', desc: 'Voce piena e vicina, compressione decisa' },
      { id: 'podcast', label: 'Podcast', desc: 'Naturale e costante, pronta per -16 LUFS' },
      { id: 'call', label: 'Call', desc: 'Massima intelligibilità, rumore al minimo' },
      { id: 'stream', label: 'Stream', desc: 'Presente e energica, emerge su musica e gioco' },
      { id: 'narrazione', label: 'Narra', desc: 'Intima e dinamica, minimo intervento' }
    ];
    const presets = defs.map((p) => ({
      label: p.label,
      pressed: p.id === preset ? 'true' : 'false',
      lamp: 'width: 10px; height: 10px; border-radius: 5px; border: 1px solid #2B2620; background: ' + (p.id === preset ? '#F0A23B' : '#6B5A3E'),
      pick: () => this.setState({ preset: p.id, dn: undefined })
    }));
    const presetDesc = defs.find((p) => p.id === preset).desc;

    // Neural noise removal: optional, default per preset, adds 20 ms on the mic path.
    const dnDefaults = { broadcast: 'off', podcast: 'off', call: 'forte', stream: 'media', narrazione: 'off' };
    const dn = s.dn ?? dnDefaults[preset];
    const dnDefs = [
      { id: 'off', label: 'Off' },
      { id: 'leggera', label: 'Leggera' },
      { id: 'media', label: 'Media' },
      { id: 'forte', label: 'Forte' }
    ];
    const dnLevels = dnDefs.map((d) => ({
      label: d.label,
      pressed: d.id === dn ? 'true' : 'false',
      lamp: 'width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; border: 1px solid #2B2620; background: ' + (d.id === dn ? (d.id === 'off' ? '#8C8270' : '#F0A23B') : '#6B5A3E'),
      pick: () => this.setState({ dn: d.id })
    }));

    const grLeds = [];
    for (let i = 0; i < 12; i++) {
      const isOn = i < lit;
      const color = i < 6 ? '#E8C25A' : i < 9 ? '#F0A23B' : '#D2553A';
      grLeds.push({ style: 'flex: 1 1 0; height: 8px; border-radius: 2px; background: ' + (isOn ? color : '#4A4238') });
    }

    const lufsVal = active ? -16.2 + (Math.random() - 0.5) * 0.6 : -19.5 + (Math.random() - 0.5) * 3;

    return {
      inAngle: this.angleFor(inDb).toFixed(1),
      outAngle: this.angleFor(outDb).toFixed(1),
      peakLamp: 'width: 10px; height: 10px; border-radius: 5px; border: 1px solid #2B2620; background: ' + (inDb > 0 ? '#D2553A' : '#6B5A3E'),
      lufs: lufsVal.toFixed(1).replace('.', ','),
      grLeds: grLeds,
      grText: (gr > 0 ? '-' : '') + gr.toFixed(1).replace('.', ',') + ' dB',
      presets: presets,
      presetDesc: presetDesc,
      dnLevels: dnLevels,
      intensity: intensity,
      knobAngle: (-135 + intensity * 2.7).toFixed(0),
      setIntensity: (e) => this.setState({ intensity: e.target.value }),
      onPressed: on ? 'true' : 'false',
      onLabel: on ? 'ON' : 'BYPASS',
      onLamp: 'width: 10px; height: 10px; border-radius: 5px; background: ' + (on ? '#F0A23B' : '#5E5548'),
      toggleOn: () => this.setState({ on: !on }),
      monPressed: mon ? 'true' : 'false',
      monLever: 'position: absolute; left: 18px; width: 6px; height: 22px; border-radius: 3px; background: #2B2620; top: ' + (mon ? '4px' : '28px'),
      monLamp: 'width: 10px; height: 10px; border-radius: 5px; border: 1px solid #2B2620; background: ' + (mon ? '#7FB3D9' : '#6B5A3E'),
      toggleMon: () => this.setState({ mon: !mon }),
      abLabel: ab,
      abHint: ab === 'A' ? 'elaborato' : 'originale',
      toggleAB: () => this.setState({ ab: ab === 'A' ? 'B' : 'A' }),
      latency: 'MIC ' + (dn === 'off' ? '1,2' : '21,2') + ' ms' + (mon ? ' · CUFFIA 4,2 ms' : '')
    };
  }
}
</script>
</body>
</html>
