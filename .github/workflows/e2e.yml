name: e2e

# Every preset and noise removal level through a private PipeWire server
# (`just test-pipewire`, `just test-e2e`). Arch Linux provides the
# PipeWire and WirePlumber 0.5 the harness is written for.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (pipewire)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - name: Install packages
        run: |
          pacman -Syu --noconfirm --needed rust clang pkgconf pipewire wireplumber just curl ffmpeg uv git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .cache/voice-strip
            testdata
          key: e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: e2e-
      - run: just test-pipewire
      - run: just test-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report
          path: target/e2e/
          if-no-files-found: ignore
