name: release

# Pushing a vX.Y.Z tag builds the Linux and macOS binaries and drafts a
# GitHub release with the matching CHANGELOG.md section. Review the draft,
# then publish it. A pull request that changes this workflow runs the builds
# only, without a release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: [.github/workflows/release.yml, scripts/macos-driver.sh, scripts/macos-app.sh, scripts/desktop.sh, assets/icon/**, extras/linux/**, extras/macos/**]

permissions:
  contents: read

jobs:
  linux:
    name: linux x86_64
    # The binary needs this runner's glibc (2.39) or newer; older Ubuntu
    # PipeWire headers do not build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev libpipewire-0.3-dev pkg-config
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - run: cargo build --release --locked -p app
      - name: Package
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          name="voice-strip-${TAG}-linux-x86_64"
          mkdir -p "dist/$name"
          mkdir -p "dist/$name/assets/icon" "dist/$name/extras/linux" "dist/$name/scripts"
          cp -R assets/icon/png assets/icon/voice-strip.svg "dist/$name/assets/icon/"
          cp extras/linux/*.desktop "dist/$name/extras/linux/"
          cp scripts/desktop.sh "dist/$name/scripts/"
          cp target/release/voice-strip "dist/$name/"
          strip "dist/$name/voice-strip"
          cp README.md CHANGELOG.md THIRD-PARTY.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macos arm64
    runs-on: macos-15
    env:
      # The driver's Info.plist asks for macOS 13 too.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - run: cargo build --release --locked -p app
      # Ad-hoc signed: no signing identity.
      - run: scripts/macos-driver.sh
      - run: scripts/macos-app.sh
      - name: Package
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          name="voice-strip-${TAG}-macos-arm64"
          mkdir -p "dist/$name"
          app="dist/$name/Voice Strip.app"
          cp -R "target/macos.noindex/Voice Strip.app" "$app"
          strip "$app/Contents/MacOS/voice-strip"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/VoiceStrip.icns"
          cp -R target/VoiceStrip.driver "dist/$name/"
          codesign --verify --strict "dist/$name/VoiceStrip.driver"
          cp README.md CHANGELOG.md THIRD-PARTY.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # The packaged app finds the driver next to it, with its revision.
          status=$("$app/Contents/MacOS/voice-strip" driver status || true)
          echo "$status"
          grep -q '^shipped: .*(revision ' <<<"$status"
          # The packaged app copies its own bundle to the Applications folder.
          HOME=$(mktemp -d) "$app/Contents/MacOS/voice-strip" app install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The CHANGELOG.md section for this version, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --draft --verify-tag --title "Voice Strip $version" --notes-file notes.md
